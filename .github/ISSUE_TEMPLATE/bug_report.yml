name: Bug report
description: Something does not convert, crashes or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't attach private documents. Describing the kind of file is usually enough.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include the error message if there was one.
    validations:
      required: true
  - type: input
    id: conversion
    attributes:
      label: Tool or conversion
      placeholder: e.g. HEIC → JPG, Compress PDF, Edit & sign
  - type: input
    id: version
    attributes:
      label: IO Convert version
      description: Shown at the bottom of Settings.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS, Linux]
    validations:
      required: true
