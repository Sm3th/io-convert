name: Feature request
description: A format, tool or improvement you would like to see.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the task, for example "convert EPUB to PDF" or "compress ten PDFs at once".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Optional. Another app, an online converter, or not at all.
